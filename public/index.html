<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourseFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>CourseFlow</h1>
    <p>Plan your semester. Stay on track.</p>

    <button id="add-course-btn">Add Course</button>

<div id="course-form" style="display: none;">
    <input id="course-code" type="text" placeholder="Course code">
    <input id="course-name" type="text" placeholder="Course name">
    <button id="save-course-btn">Save Course</button>
</div>

<div id="course-list"></div>
    <script src="script.js"></script>
</body>
</html>
